[tox]
skipsdist = True
envlist = flake8, py313

[testenv]
commands =
    flake8: flake8 bin mapit_global
    py313: pytest --doctest-modules --cov=bin --cov=mapit_global --cov-append
deps =
    flake8: flake8
    py313: -r{toxinidir}/requirements.txt
    py313: -r{toxinidir}/test_requirements.txt
    py313: -r{toxinidir}/script_requirements.txt

[testenv:flake8]
skip_install = True

[gh-actions]
python =
    3.13: flake8, py313

[gh-actions:env]
THING_TO_TEST =
  flake8: flake8
  py313: py313
